{% extends 'base.html' %}{% block title %}Ingreso · BIBLIOCONTROL MHC{% endblock %}{% block content %}
<section class="auth-card">
  <img class="login-logo" src="{{ url_for('static', filename='img/logo.jpg') }}" alt="MHC">
  <h1 class="auth-title">BIBLIOCONTROL</h1>
  <p class="auth-sub">Gestión de bibliotecas</p>
  <form method="post" class="auth-form">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>Usuario<input name="username" required autocomplete="username"></label>
    <label>Contraseña<input name="password" type="password" required autocomplete="current-password"></label>
    <button class="button primary">Ingresar</button>
  </form>
</section>
{% endblock %}
