{% extends 'base.html' %}{% block title %}Ingreso · Bibliocontrol{% endblock %}{% block content %}
<section class="auth-card">
  <img class="login-logo" src="{{ url_for('static', filename='img/logo.jpg') }}" alt="MHC">
  <h1 class="auth-title">BIBLIOCONTROL</h1>
  <p class="auth-sub">Gestión de bibliotecas</p>
  <div class="auth-divider"><span data-icon="book"></span></div>
  <h2 class="auth-welcome">Bienvenido</h2>
  <p class="auth-hint">Accede al sistema de gestión bibliográfica</p>
  <form method="post" class="auth-form">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>Usuario<div class="input-wrap"><span data-icon="user"></span><input name="username" required autocomplete="username" placeholder="Ingrese su usuario"></div></label>
    <label>Contraseña<div class="input-wrap"><span data-icon="lock"></span><input name="password" type="password" required autocomplete="current-password" placeholder="Ingrese su contraseña"><button type="button" class="eye" data-toggle-pass aria-label="Mostrar u ocultar contraseña"><span data-icon="eye"></span></button></div></label>
    <button class="login-btn"><span data-icon="login"></span>Ingresar</button>
  </form>
</section>
{% endblock %}
