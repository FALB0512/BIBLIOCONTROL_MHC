{% extends 'base.html' %}{% block title %}Configuración inicial · BIBLIOCONTROL{% endblock %}{% block content %}
<section class="auth-card">
  <img class="login-logo" src="{{ url_for('static', filename='img/logo.jpg') }}" alt="MHC">
  <h1 class="auth-title">Configuración inicial</h1>
  <p class="auth-sub">Crea la cuenta administradora para comenzar.</p>
  <form method="post" class="auth-form">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>Usuario administrador<input name="username" maxlength="40" required autocomplete="username"></label>
    <label>Contraseña (mínimo 10 caracteres)<input type="password" name="password" minlength="10" required autocomplete="new-password"></label>
    <button class="button success">Crear administrador</button>
  </form>
</section>
{% endblock %}
